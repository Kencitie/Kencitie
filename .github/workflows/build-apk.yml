
name: Build Kencitie Android APK


on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Kencitie project
        run: |
          mkdir extracted
          unzip kencitie_flutter_settings_repaired.zip -d extracted
          PROJECT_DIR=$(find extracted -name pubspec.yaml -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_EN
      
      - name: Add Firebase configuration
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Generating Android platform files..."
          flutter create --platforms=android .

          echo "Checking Android app folder..."
          test -d android/app

          echo "Copying Firebase configuration..."
          cp "$GITHUB_WORKSPACE/google-services.json" android/app/google-services.json

          echo "Checking Firebase file..."
          test -f android/app/google-services.json
          ls -l android/app/google-services.json

          echo "Firebase configuration copied successfully"



      - name: Build Android APK
        run: |
       
      - name: Get Kencitie SHA fingerprints
        run: |
          set -e
          APK_PATH=$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi
          echo "=== KENCITIE CERTIFICATE FINGERPRINTS ==="
          keytool -printcert -jarfile "$APK_PATH" | grep -E "SHA1:|SHA256:"

          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release


      - name: Upload Kencitie APK
        uses: actions/upload-artifact@v4
        with:
          name: Kencitie-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
