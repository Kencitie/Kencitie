
name: Build Kencitie Android APK


on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      
      - name: Extract Kencitie project
        run: |
          set -e
          mkdir -p extracted

          unzip -o kencitie_flutter_settings_repaired.zip -d extracted

          PROJECT_FILE=$(find extracted -name pubspec.yaml -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Flutter project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Found project at: $PROJECT_DIR"

          if [ -z "$GITHUB_ENV" ]; then
            echo "GITHUB_ENV is not set"
            exit 1
          fi

          printf 'PROJECT_DIR=%s\n' "$PROJECT_DIR" >> "$GITHUB_ENV"

      
      - name: Add Firebase configuration
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Generating Android platform files..."
          flutter create --platforms=android .

          echo "Checking Android app folder..."
          test -d android/app

          echo "Copying Firebase configuration..."
          cp "$GITHUB_WORKSPACE/google-services.json" android/app/google-services.json

          echo "Checking Firebase file..."
          test -f android/app/google-services.json
          ls -l android/app/google-services.json

          echo "Firebase configuration copied successfully"



      
      - name: Build Android APK
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Installing Flutter dependencies..."
          flutter pub get

          echo "Building Kencitie release APK..."
          flutter build apk --release

          echo "Checking APK..."
          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK build completed successfully"

      
      - name: Get Kencitie SHA fingerprints
        run: |
          set -e

          APK_PATH="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          echo "Checking APK..."
          test -f "$APK_PATH"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK location not found"
            exit 1
          fi

          APKSIGNER=$(find "$SDK_ROOT/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ApkSigner not found"
            exit 1
          fi

          echo "=== KENCITIE SHA FINGERPRINTS ==="
          "$APKSIGNER" verify --print-certs "$APK_PATH"



          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release


      - name: Upload Kencitie APK
        uses: actions/upload-artifact@v4
        with:
          name: Kencitie-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
