
name: Build Kencitie Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Kencitie project
        run: |
          mkdir extracted
          unzip kencitie_flutter_settings_repaired.zip -d extracted
          PROJECT_DIR=$(find extracted -name pubspec.yaml -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

  
      
            - name: Generate Android platform files
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android .

      - name: Add Firebase configuration
        run: |
          cp "$GITHUB_WORKSPACE/google-services.json" "$PROJECT_DIR/android/app/google-services.json"
          echo "Firebase configuration copied successfully"
          echo "=== KENCITIE ANDROID PACKAGE ==="
          grep -nE 'applicationId|namespace' android/app/build.gradle*


      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release


      - name: Upload Kencitie APK
        uses: actions/upload-artifact@v4
        with:
          name: Kencitie-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
